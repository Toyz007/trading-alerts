name: alerts

on:
  schedule:
    # Every 5 minutes. GitHub treats cron as best-effort and can delay runs
    # under load, so treat this as "within ~15 minutes", not "on the dot".
    - cron: '*/5 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can commit state.json back and not re-send alerts it already sent.
permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false   # never cancel a run that might be mid-send

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # v5 of both actions targets the Node 24 runtime. v4 targeted Node 20,
      # which GitHub deprecated - it still ran, but emitted a warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check levels
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node watcher.mjs

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "alerts-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: alert fired [skip ci]"
            # Another run may have pushed while we worked; rebase and retry once.
            git pull --rebase --autostash || true
            git push
          else
            echo "no state change"
          fi
